name: rekord
description: >-
  Rekord is a Dublin-based fintech platform that helps banks and fintechs automate
  credit underwriting and customer onboarding. Its AI-native decisioning platform
  unifies data from many sources into a single view, orchestrates decision
  workflows, runs a natural-language policy engine, and provides AI-assisted case
  management so credit and risk teams can make defensible, transparent decisions at
  scale. Rekord surfaces the signal buried in large volumes of applicant and
  transaction data to speed underwriting and onboarding while enforcing identity
  verification and compliance. It is a portfolio company of point-nine. Rekord does
  not currently publish a public developer API, documentation portal, or machine
  discovery surface; this profile captures its public identity and domain-security
  posture for the API Evangelist network.
